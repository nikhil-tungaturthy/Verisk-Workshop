version: 2

sources:
  - name: carrier_b_raw
    description: |
      Raw landed files from Carrier_B quarterly submissions.

      Pattern A (single flat file): one row per policy, with optional claim
      columns populated when CLAIM_NBR is non-null. ~26% of rows in a typical
      submission carry a claim; the remaining ~74% are premium-only.

      All PII columns (insrd_name, insrd_addr_1, insrd_city) are tagged with
      meta.contains_pii=true and are deliberately dropped at the staging layer.
    database: "{{ var('carrier_b_raw_database') }}"
    schema:   "{{ var('carrier_b_raw_schema') }}"

    tables:
      - name: synthetic_carrier_b
        description: |
          Carrier_B GL transactions, one row per policy. Loss columns
          (claim_nbr, acc_dt, rpt_dt, clm_status, loss_type, pd_indem,
          case_rsv, pd_alae, total_alae, recovery_amt) are populated only
          when the policy has an associated claim.

        columns:
          - name: pol_nbr
            description: Policy number; used as POLICY_ID downstream
            tests:
              - not_null
              - unique

          - name: insrd_name
            description: Insured name (PII — never select downstream)
            meta:
              contains_pii: true

          - name: insrd_addr_1
            description: Insured street address line 1 (PII)
            meta:
              contains_pii: true

          - name: insrd_city
            description: Insured city (PII)
            meta:
              contains_pii: true

          - name: insrd_st
            description: Insured state (2-letter code; ~6% null in observed sample)

          - name: insrd_zip
            description: Insured ZIP code (numeric in source; zero-padded to 5 digits downstream)

          - name: eff_dt
            description: |
              Policy effective date. Observed in four mixed formats within the same column:
              MM/DD/YYYY, MM-DD-YYYY, YYYY-MM-DD, YYYYMMDD.
              Parsed via the parse_mixed_date macro at the staging layer.
            tests:
              - not_null

          - name: exp_dt
            description: Policy expiration date (same mixed formats as eff_dt)
            tests:
              - not_null

          - name: asl
            description: |
              Annual Statement Line (NUMBER(38,1)). GL codes are 17.1, 17.2, 18.1, 18.2.
              Non-GL codes (e.g., 17.65) are dropped at the int_gl__filtered_transactions layer.
            tests:
              - not_null

          - name: class_cd
            description: ISO GL class code (5-digit; stored as integer in source)

          - name: wrt_prem
            description: Written premium
            tests:
              - not_null

          - name: ern_prem
            description: |
              Earned premium. 100% null in observed sample — pipeline computes
              pro-rata earned from wrt_prem, policy term, and eval_date.

          - name: pol_type
            description: Policy packaging — MONO (monoline) or PKG (package)

          - name: claim_nbr
            description: Claim number. Null on premium-only rows.

          - name: acc_dt
            description: Accident date (loss rows only). Already typed as DATE in source.

          - name: rpt_dt
            description: |
              Report date (loss rows only). Used as STATUS_DATE proxy in the
              standardized output; flagged via QC_FLAG=STATUS_DATE_PROXY.

          - name: clm_status
            description: Claim status raw value — OPEN / CLSD / REOP.

          - name: loss_type
            description: Loss category (descriptive; passes through to TOL).

          - name: pd_indem
            description: Paid indemnity

          - name: case_rsv
            description: Case reserve

          - name: pd_alae
            description: Paid Allocated Loss Adjustment Expense (paid ALAE)

          - name: total_alae
            description: Total (incurred) ALAE

          - name: recovery_amt
            description: |
              Recoveries on the claim. 97% null in observed sample — coalesced
              to 0 in the incurred indemnity calculation.
