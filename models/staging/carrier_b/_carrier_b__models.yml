version: 2

models:
  - name: stg_carrier_b__transactions
    description: |
      Carrier_B raw → standardized column names and types. Pure renames,
      casts, and date parsing. PII columns (insrd_name, insrd_addr_1,
      insrd_city) are deliberately dropped here.

    columns:
      - name: carrier_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CARRIER_B']

      - name: submission_id
        tests: [not_null]

      - name: eval_date
        tests: [not_null]

      - name: policy_id
        tests: [not_null]

      - name: claim_id

      - name: state

      - name: zip_cd

      - name: asl_normalized
        tests: [not_null]

      - name: class_cd

      - name: policy_eff_date
        tests: [not_null]

      - name: policy_exp_date
        tests: [not_null]

      - name: top
        tests:
          - accepted_values:
              arguments:
                values: ['MONO', 'PKG']

      - name: clm_status_raw
        tests:
          - accepted_values:
              arguments:
                values: ['OPEN', 'CLSD', 'REOP']
              config:
                where: "claim_id is not null"

      - name: wprem
        tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                severity: warn