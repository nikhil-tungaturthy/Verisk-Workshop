version: 2

seeds:
  - name: synthetic_carrier_b
    description: |
      Carrier_B raw landing data, loaded as a seed for local testing.
      The literal string "NULL" appears in several columns for missing
      values; staging handles this via nullif() wrappers.
    config:
      tags: ['carrier_b_raw']
      column_types:
        pol_nbr: varchar
        insrd_name: varchar
        insrd_addr_1: varchar
        insrd_city: varchar
        insrd_st: varchar
        insrd_zip: number(38, 0)
        eff_dt: varchar
        exp_dt: varchar
        asl: number(38, 1)
        class_cd: number(38, 0)
        wrt_prem: number(38, 0)
        ern_prem: varchar
        pol_type: varchar
        claim_nbr: varchar
        acc_dt: varchar
        rpt_dt: varchar
        clm_status: varchar
        loss_type: varchar
        pd_indem: number(38, 1)
        case_rsv: number(38, 1)
        pd_alae: number(38, 1)
        total_alae: number(38, 1)
        recovery_amt: number(38, 1)

  - name: asl_to_subline
    description: ASL code → Verisk subline classification (GL-PO or GL-PC)
    config:
      column_types:
        asl_normalized: varchar(4)
        subline: varchar(10)
    columns:
      - name: asl_normalized
        tests:
          - not_null
          - unique
      - name: subline
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GL-PO', 'GL-PC']

  - name: asl_to_coverage
    description: ASL code → coverage trigger (OCC or CM)
    config:
      column_types:
        asl_normalized: varchar(4)
        coverage_trigger: varchar(3)
    columns:
      - name: asl_normalized
        tests:
          - not_null
          - unique
      - name: coverage_trigger
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OCC', 'CM']

  - name: policy_size_bands
    description: Policy size band thresholds by written premium
    config:
      column_types:
        band: varchar(10)
        band_min: integer
        band_max: integer
    columns:
      - name: band
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['MICRO', 'SMALL', 'MEDIUM', 'LARGE', 'JUMBO']
      - name: band_min
        tests:
          - not_null

  - name: size_of_loss_bands
    description: SOL band thresholds by incurred indemnity (bands 1-11)
    config:
      column_types:
        band: varchar(2)
        band_min: integer
        band_max: integer
    columns:
      - name: band
        tests:
          - not_null
          - unique
      - name: band_min
        tests:
          - not_null

  - name: claim_status_codes
    description: Raw claim status → standardized status code
    config:
      column_types:
        raw_status: varchar(10)
        status_code: varchar(1)
    columns:
      - name: raw_status
        tests:
          - not_null
          - unique
      - name: status_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['O', 'C', 'R']